<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Экран</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>html,body{height:100%;margin:0;background:#000;color:#fff;font:17px/1.4 Inter,-apple-system,system-ui,sans-serif}
main{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
a{display:block;min-height:44px;line-height:44px;padding:0 24px;border-radius:12px;background:#0A84FF;color:#fff;text-decoration:none;text-align:center}</style>
</head><body><main><a id="go" href="http://100.65.158.7:6080/vnc.html?autoconnect=true&resize=scale&reconnect=true">Открыть экран</a></main>
<script>
// Telegram пускает в кнопку меню только https, а вход на экран идёт по адресу внутри Tailscale.
var go=document.getElementById('go');var t=window.Telegram&&Telegram.WebApp;
if(t){t.ready();t.expand();}
go.addEventListener('click',function(e){if(t&&t.openLink&&t.initData){e.preventDefault();t.openLink(go.href);}});
location.replace(go.href);
</script></body></html>
